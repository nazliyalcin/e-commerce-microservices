server:
  port: 8080  # Gateway portu

spring:
  application:
    name: api-gateway

  cloud:
    gateway: 
      routes:
        # 🔹 User Service
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/users/**, /auth/**
          filters:
            - JwtAuthenticationFilter

        # 🔹 Product Service
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/products/**
          filters:
            - JwtAuthenticationFilter

        # 🔹 Order Service
          # gRPC ile haberleşse de REST endpointleri varsa buraya da ekleyebiliriz
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/orders/**
          filters:
            - JwtAuthenticationFilter

      default-filters:
        - AddResponseHeader=Access-Control-Allow-Origin, *
        - AddResponseHeader=Access-Control-Allow-Methods, GET,POST,PUT,DELETE,OPTIONS
        - AddResponseHeader=Access-Control-Allow-Headers, Content-Type, Authorization

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: "MySuperSecretKeyForJwtAuth1234567890"