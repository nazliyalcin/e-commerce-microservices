version: '3.9'

services:
  # 🟦 PostgreSQL - Users
  postgres-users:
    image: postgres:15
    container_name: postgres-users
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 🟦 PostgreSQL - Products
  postgres-products:
    image: postgres:15
    container_name: postgres-products
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
    ports:
      - "5433:5432"
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 🟦 PostgreSQL - Orders
  postgres-orders:
    image: postgres:15
    container_name: postgres-orders
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5434:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 🟨 User Service
  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      postgres-users:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      JWT_SECRET: MySuperSecretKeyForJwtAuth1234567890
      JWT_EXPIRATION: 3600000
    ports:
      - "8081:8081"

  # 🟨 Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      postgres-products:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-products:5432/products
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      GRPC_SERVER_PORT: 9090
    ports:
      - "8082:8082"
      - "9090:9090"

  # 🟨 Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      postgres-orders:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      GRPC_CLIENT_PRODUCT_SERVICE_ADDRESS: static://product-service:9090
      GRPC_CLIENT_PRODUCT_SERVICE_NEGOTIATIONTYPE: plaintext
    ports:
      - "8083:8083"

  # 🟩 API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      # Gateway route environment variables (isteğe bağlı)
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "8080:8080"

volumes:
  postgres_users_data:
  postgres_products_data:
  postgres_orders_data:
